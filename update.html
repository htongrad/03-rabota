<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffbf56">
<title>Обновление панели 03</title>
<style>
  body { font: 1rem/1.5 system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1.25rem; color-scheme: light dark; }
  a { color: inherit; }
</style>
<h1>Обновление панели 03</h1>
<p id="status" role="status">Проверяю обновление…</p>
<p><a href="./">Открыть панель</a></p>
<script>
  const status = document.querySelector('#status');
  async function checkUpdate() {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' });
      await registration.update();
      const incoming = registration.installing || registration.waiting;
      if (incoming && incoming.state !== 'activated') {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => finish(new Error()), 12000);
          function finish(error) {
            clearTimeout(timer);
            incoming.removeEventListener('statechange', check);
            if (error) reject(error);
            else resolve();
          }
          function check() {
            if (incoming.state === 'activated') finish();
            else if (incoming.state === 'redundant') finish(new Error());
          }
          incoming.addEventListener('statechange', check);
          check();
        });
      }
      status.textContent = 'Обновление проверено. Открываю панель.';
      location.replace('./');
    } catch {
      status.textContent = 'Не удалось проверить обновление. Проверь интернет и обнови эту страницу.';
    }
  }
  checkUpdate();
</script>
</html>
