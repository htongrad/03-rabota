<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="panel-build" content="2.5.0">
<title>Работа</title>
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f0f2ee">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17201d">
<meta name="description" content="Работа · Дела, календарь, заметки и точки.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png?v=2.1.0">
<link rel="apple-touch-icon" href="./icon-192.png?v=2.1.0">
<link rel="stylesheet" href="./relief.css?v=2.5.0">
</head>
<body>
<div id="personal">
  <header><button type="button" class="brand" data-page="overview" aria-label="Работа. Открыть обзор"><img src="./icon-192.png?v=2.1.0" width="38" height="38" alt="">Работа</button><button type="button" id="header-sync" aria-label="Синхронизировать" title="Синхронизировать" disabled>
    <svg class="ui-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 14-5l2 2 M20 3v5h-5 M20 13a8 8 0 0 1-14 5l-2-2 M4 21v-5h5"/></svg>
  </button><details class="menu">
    <summary aria-label="Меню"><svg class="ui-icon" aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h.1 M12 12h.1 M20 12h.1"/></svg></summary>
    <div class="menu-items">
      <button type="button" id="google-open">Синхронизация Google</button>
      <button type="button" data-action="point-settings" hidden>Настроить карточки точек</button>
      <button type="button" data-action="backups">Копии данных</button>
      <button type="button" data-action="install" hidden>Установить приложение</button>
      <small>Сборка 2.5.0</small>
    </div>
  </details></header>
  <p class="notice" role="status" hidden></p>
  <main></main>
  <dialog id="google-dialog" aria-labelledby="google-title">
    <div class="stack">
      <div class="help-title"><h2 id="google-title">Google Диск и Календарь</h2><button type="button" class="help" data-hint="Сохранит копию на Диске и обновит события в календаре этой панели." aria-label="Подсказка: синхронизация" aria-expanded="false"><span aria-hidden="true">?</span></button></div>
      <p id="google-status" role="status"></p>
      <p id="google-folder-status" class="quiet"></p>
      <p id="google-last-sync" class="quiet"></p>
      <details id="google-settings">
        <summary>Настройки подключения</summary>
        <form id="google-config" class="stack">
          <p class="quiet">Можно заполнить поля из «Личного», если обе панели открываются в одном Chrome.</p>
          <button type="button" id="google-use-personal" class="action">Заполнить из «Личного»</button>
          <div class="quality-field">
            <div class="quality-actions"><label for="google-client-id">Client ID</label></div>
            <input id="google-client-id" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="quality-field">
            <div class="quality-actions"><label for="google-project-number">Номер проекта</label></div>
            <input id="google-project-number" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <div class="quality-field">
            <div class="quality-actions"><label for="google-api-key">API key для выбора папки</label></div>
            <input id="google-api-key" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
          </div>
          <button type="submit" class="action primary">Сохранить настройки</button>
        </form>
      </details>
      <button type="button" id="google-sync-now" class="action primary" hidden>Синхронизировать</button>
      <button type="button" id="google-folder" class="action" hidden>Изменить папку</button>
      <button type="button" id="google-restore" class="action" hidden>Восстановить последнюю копию</button>
      <button type="button" id="google-disconnect" class="action" hidden>Отключить доступ</button>
      <section class="module stack" aria-label="Зеркало Google Календаря">
        <h3>Календарь «03 РАБОТА»</h3>
        <p id="google-calendar-status" role="status"></p>
        <p id="google-calendar-last-sync" class="quiet"></p>
        <p class="quiet">События отправляются по московскому времени.</p>
      </section>
      <button type="button" id="google-close" class="action">Закрыть</button>
    </div>
  </dialog>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <div class="bottom">
    <button type="button" class="create" aria-label="Создать запись" hidden><svg class="ui-icon" aria-hidden="true" focusable="false" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"/></svg></button>
    <nav aria-label="Разделы">
      <button type="button" data-page="overview"><svg class="ui-icon" aria-hidden="true" focusable="false" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.5h7v8H3z M14 3.5h7v4h-7z M3 15.5h7v5H3z M14 11.5h7v9h-7z"/></svg>Обзор</button>
      <button type="button" data-page="calendar"><svg class="ui-icon" aria-hidden="true" focusable="false" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4z M4 10h16 M8 3v5 M16 3v5 M8 14h3"/></svg>Календарь</button>
      <button type="button" data-page="notes"><svg class="ui-icon" aria-hidden="true" focusable="false" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h14v17H5z M8 3.5v17 M11 8h5 M11 12h4"/></svg>Заметки</button>
      <button type="button" data-page="points"><svg class="ui-icon" aria-hidden="true" focusable="false" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l2-5h14l2 5v2H3z M5 11v9h14v-9 M10 20v-6h4v6"/></svg>Точки</button>
    </nav>
  </div>
</div>
<script src="./calendar-sync.js?v=2.5.0" defer></script>
<script src="./google-sync.js?v=2.5.0" defer></script>
<script src="./work-items.js?v=2.5.0"></script>
<script id="personal-script">
(() => {
  const root = document.getElementById('personal');

  const hintPopup = document.createElement('div');
  hintPopup.className = 'hint-popup';
  hintPopup.id = 'panel-hint';
  hintPopup.setAttribute('role','tooltip');
  hintPopup.hidden = true;
  let hintTrigger;
  function closeHint() {
    if (!hintTrigger) return;
    hintTrigger.setAttribute('aria-expanded','false');
    hintTrigger.removeAttribute('aria-describedby');
    hintPopup.hidden = true;
    hintTrigger = null;
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('button[data-hint]');
    if (button === hintTrigger || !button) { closeHint(); return; }
    closeHint();
    hintTrigger = button;
    (button.closest('dialog') || root).append(hintPopup);
    button.setAttribute('aria-expanded','true');
    button.setAttribute('aria-describedby',hintPopup.id);
    hintPopup.textContent = button.dataset.hint;
    hintPopup.hidden = false;
    positionHint();
  }, true);
  function positionHint() {
    if (!hintTrigger) return;
    const anchor = hintTrigger.getBoundingClientRect();
    const width = document.documentElement.clientWidth;
    const height = window.visualViewport?.height || window.innerHeight;
    if (!hintTrigger.isConnected || anchor.bottom < 0 || anchor.top >= height) { closeHint(); return; }
    hintPopup.style.left = Math.max(8,Math.min(anchor.right - hintPopup.offsetWidth,width - hintPopup.offsetWidth - 8)) + 'px';
    const bottom = anchor.bottom + 4;
    const top = bottom + hintPopup.offsetHeight <= height - 8 ? bottom : anchor.top - hintPopup.offsetHeight - 4;
    hintPopup.style.top = Math.max(8,top) + 'px';
  }
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && hintTrigger) { event.preventDefault(); event.stopPropagation(); closeHint(); }
  }, true);
  document.addEventListener('focusin', event => { if (hintTrigger && event.target !== hintTrigger) closeHint(); });
  document.addEventListener('scroll', positionHint, true);
  document.addEventListener('close', closeHint, true);
  window.addEventListener('resize', positionHint);
  window.visualViewport?.addEventListener('resize', () => {
    positionHint();
    const viewport = window.visualViewport;
    root.toggleAttribute('data-keyboard', viewport.scale === 1 && innerHeight - viewport.height > 100);
  });

  const main = root.querySelector('main');
  const nav = root.querySelector('nav');
  const create = root.querySelector('.create');
  const notice = root.querySelector('.notice');
  function refreshSyncSummary() { window.refreshGoogleStatus?.(); }
  const storageKey = 'panel-03:base:v1';
  const workItems = window.panel03WorkItems;
  const menu = root.querySelector('.menu');
  const installButton = menu.querySelector('[data-action=install]');
  const pointSettingsButton = menu.querySelector('[data-action=point-settings]');
  let installPrompt = null;
  const backupFile = root.querySelector('#backup-file');
  let candidate = null;
  let storageReadable = true;
  const labels = {overview:'Обзор', calendar:'Календарь', notes:'Заметки', points:'Точки'};
  const defaultPointSettings = {
    statuses: [
      {id:'active', label:'Работает', archived:false},
      {id:'opening', label:'Готовится к открытию', archived:false},
    ],
    fields: [],
  };
  const pointSettings = records => records.pointSettings ?? defaultPointSettings;
  const visiblePointFields = () => pointSettings(data).fields.filter(field => !field.archived);
  const createActions = {calendar:['new-event','Создать событие'], notes:['new-note','Создать заметку'],
    points:['new-point','Добавить точку']};
  const periods = {day:'День', week:'Неделя', month:'Месяц'};
  const repeats = {none:'Не повторяется', daily:'Каждый день', weekdays:'По будням', weekly:'Каждую неделю', monthly:'Каждый месяц', yearly:'Каждый год'};
  const fullDate = new Intl.DateTimeFormat('ru', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'});
  const shortDate = new Intl.DateTimeFormat('ru', {day:'numeric', month:'long', timeZone:'UTC'});
  const dayOfWeek = new Intl.DateTimeFormat('ru', {weekday:'short', timeZone:'UTC'});
  const monthName = new Intl.DateTimeFormat('ru', {month:'long', year:'numeric', timeZone:'UTC'});
  const dayMs = 86400000;
  let today = localDay(new Date());
  let dayTimer;
  let selected = today;
  let month = today.slice(0, 7);
  let period = 'day';
  let page = 'overview';
  let view = null;
  const emptyRecords = () => ({events:[], notes:[], points:[], tasks:[]});
  let data = emptyRecords();
  // An explicit prior reset permits synchronising an empty panel on this device.
  function wasResetHere() {
    try {
      const raw = localStorage.getItem('panel-03:network');
      const network = raw && JSON.parse(raw);
      return network && ['profiles','points'].every(key => Array.isArray(network[key]) && network[key].length === 0)
        && !Object.keys(localStorage).some(key => key.startsWith('panel-03:event:'));
    } catch { return false; }
  }
  let loadedRecords = null;
  try {
    loadedRecords = localStorage.getItem(storageKey);
    if (loadedRecords) data = validate(JSON.parse(loadedRecords));
    else if (wasResetHere()) {
      loadedRecords = JSON.stringify(data);
      localStorage.setItem(storageKey, loadedRecords);
    }
  } catch {
    storageReadable = false;
    showNotice('Не удалось прочитать записи браузера. Сохранение отключено, чтобы не перезаписать данные.');
  }

  function readLegacyCopy(value) {
    if (value?.format === 'panel-03-backup' && value.version === 1 && value.records && typeof value.records === 'object' && !Array.isArray(value.records)) {
      const events = Object.entries(value.records).filter(([key]) => key.startsWith('panel-03:event:')).map(([,event]) => {
        const {id,title,date,start} = event;
        const end = event.end || (start ? new Date(date+'T'+start+':00Z').getTime()+3600000 : '');
        return {id,title,date,start,allDay:!start,end:typeof end === 'number' ? new Date(end).toISOString().slice(11,16) : end,repeat:'none',ending:'never',exceptions:{}};
      });
      return {events,notes:[]};
    }
    return value;
  }
  function validPointDefinitions(rows) {
    return Array.isArray(rows) && rows.every(row => row && typeof row.id === 'string' && /^[a-z0-9-]+$/.test(row.id) &&
      typeof row.label === 'string' && row.label.trim() && typeof row.archived === 'boolean') &&
      new Set(rows.map(row => row.id)).size === rows.length;
  }
  function validate(value) {
    value = readLegacyCopy(value);
    const version = value?.format === '03-rabota-backup' ? value.version : undefined;
    const records = [2, 3, 4, 5, 6].includes(version) ? value.data
      : Number.isSafeInteger(value?.revision) ? value.data : value;
    const points = records?.points === undefined && !(version >= 4) ? [] : records?.points;
    const tasks = records?.tasks === undefined && version !== 6 ? [] : records?.tasks;
    const str = value => typeof value === 'string';
    const date = value => str(value) && /^\d{4}-\d{2}-\d{2}$/.test(value) &&
      Number.isFinite(+asDate(value)) && key(asDate(value)) === value;
    const time = value => str(value) && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value);
    const record = item => item && str(item.id) && item.id.length > 0 && str(item.title) && item.title.trim();
    const entry = item => item && str(item.title) && item.title.trim() && date(item.date) &&
      (item.allDay === true || (time(item.start) && time(item.end) && item.start < item.end));
    const unique = rows => new Set(rows.map(row => row.id)).size === rows.length;
    if (!Array.isArray(records?.events) || !Array.isArray(records?.notes) ||
        !records.notes.every(note => record(note) && str(note.text)) ||
        !records.events.every(event => record(event) && entry(event) && Object.hasOwn(repeats,event.repeat) &&
          ['never','date','count'].includes(event.ending) &&
          (event.ending !== 'date' || date(event.until)) &&
          (event.ending !== 'count' || (Number.isSafeInteger(event.count) && event.count > 0)) &&
          (!event.stopBefore || date(event.stopBefore)) &&
          event.exceptions && typeof event.exceptions === 'object' && !Array.isArray(event.exceptions) &&
          Object.entries(event.exceptions).every(([slot,item]) => date(slot) && (item === null || entry(item)))) ||
        !unique(records.events) || !unique(records.notes)) throw new Error('Invalid backup');
    const settings = pointSettings(records);
    if (records.pointSettings === null || (version === 5 && !records.pointSettings) ||
        !validPointDefinitions(settings.statuses) || !settings.statuses.some(status => !status.archived) ||
        !defaultPointSettings.statuses.every(status => settings.statuses.some(item => item.id === status.id)) ||
        !validPointDefinitions(settings.fields) || !settings.fields.every(field => str(field.hint))) {
      throw new Error('Invalid point settings');
    }
    const statusIds = new Set(settings.statuses.map(status => status.id));
    const fieldIds = new Set(settings.fields.map(field => field.id));
    const validValues = values => values === undefined || (values && typeof values === 'object' && !Array.isArray(values) &&
      Object.entries(values).every(([id, value]) => fieldIds.has(id) && str(value)));
    if (!Array.isArray(points) || !points.every(point => point && str(point.id) && point.id.length > 0 &&
        str(point.name) && point.name.trim() && statusIds.has(point.status) && str(point.owner) && validValues(point.values)) ||
        !unique(points)) throw new Error('Invalid point records');
    if (!workItems.validTasks(tasks, points, date)) throw new Error('Invalid work items');
    const validated = {events:records.events, notes:records.notes, points, tasks};
    if (records.pointSettings !== undefined) validated.pointSettings = settings;
    // Preserve saved prototype data as an archive while running the restored interface.
    const archive = records.chef;
    if (archive && (archive.mode || archive.points?.length || archive.audits?.length)) validated.chef = archive;
    return validated;
  }
  function backupVersion(records) {
    if (records.tasks.length) return 6;
    if (records.pointSettings) return 5;
    if (records.points.length) return 4;
    return Object.hasOwn(records, 'chef') ? 3 : 2;
  }
  function downloadBackup() {
    const backup = {format:'03-rabota-backup',version:backupVersion(data),exportedAt:new Date().toISOString(),data};
    const url = URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)], {type:'application/json'}));
    const link = document.createElement('a');
    link.href = url;
    link.download = '03-rabota-' + localDay(new Date()) + '.json';
    root.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  backupFile.addEventListener('change', async () => {

    const file = backupFile.files[0];
    backupFile.value = '';
    if (!file) return;
    candidate = null;
    let contents;
    let error = '';
    try { contents = await file.text(); }
    catch { error = 'Браузер не смог прочитать файл копии.'; }
    if (!error) {
      try { contents = JSON.parse(contents); }
      catch { error = 'Файл копии должен содержать корректный JSON.'; }
    }
    if (!error) {
      try { candidate = validate(contents); }
      catch { error = 'Формат копии не поддерживается или в записях есть ошибки.'; }
    }
    showNotice(error);
    view = {type:'backups'};
    render();
  });

  function key(date) { return date.toISOString().slice(0, 10); }
  function localDay(date) {
    return new Intl.DateTimeFormat('sv-SE', {timeZone:'Europe/Moscow', year:'numeric', month:'2-digit', day:'2-digit'}).format(date);
  }
  function updateToday() {
    const now = new Date();
    const currentDay = localDay(now);
    if (currentDay !== today) {
      const followToday = selected === today && !view;
      today = currentDay;
      if (followToday) {
        selected = today;
        month = today.slice(0, 7);
      }
      if ((!view && (page === 'overview' || page === 'calendar')) ||
          (view?.type === 'tasks' && taskPanel.isList())) render();
    }
    const midnight = new Date(+now);
    midnight.setTime(+asDate(currentDay) + 21 * 3600000);
    clearTimeout(dayTimer);
    dayTimer = setTimeout(updateToday, Math.min(midnight - now, 3600000));
  }
  function asDate(value) { return new Date(value + 'T00:00:00Z'); }
  function capital(text) { return text.charAt(0).toUpperCase() + text.slice(1); }
  function escape(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[char]));
  }
  function showNotice(text) { notice.textContent = text; notice.hidden = !text; }
  function save(records = data, storageError = '') {
    if (!storageReadable) return false;
    try {
      if (localStorage.getItem(storageKey) !== loadedRecords) {
        showNotice('Записи изменились в другом окне. Скачайте копию несохранённых изменений и откройте панель заново.');
        return false;
      }
      const serialized = JSON.stringify(records);
      localStorage.setItem(storageKey, serialized);
      loadedRecords = serialized;
    } catch (error) {
      showNotice(error.name === 'QuotaExceededError' && storageError
        ? storageError
        : 'Браузер не сохранил изменения. Скачайте копию до закрытия панели.');
      return false;
    }
    showNotice('');
    window.dispatchEvent(new Event('panel-03:records-changed'));
    return true;
  }
  function weekday(date) { return date.getUTCDay() >= 1 && date.getUTCDay() <= 5; }
  function ordinal(event, date) {
    if (date < event.date) return 0;
    const start = asDate(event.date);
    const day = asDate(date);
    const distance = (day - start) / dayMs;
    if (event.repeat === 'none') return distance === 0 ? 1 : 0;
    if (event.repeat === 'daily') return distance + 1;
    if (event.repeat === 'weekly') return distance % 7 === 0 ? distance / 7 + 1 : 0;
    if (event.repeat === 'weekdays') {
      if (!weekday(day)) return 0;
      const length = distance + 1;
      let count = Math.floor(length / 7) * 5;
      for (let i = 0; i < length % 7; i++) {
        if (weekday(new Date(+start + i * dayMs))) count++;
      }
      return count;
    }
    if (start.getUTCDate() !== day.getUTCDate()) return 0;
    if (event.repeat === 'yearly' && start.getUTCMonth() !== day.getUTCMonth()) return 0;
    const months = (day.getUTCFullYear() - start.getUTCFullYear()) * 12 + day.getUTCMonth() - start.getUTCMonth();
    const step = event.repeat === 'yearly' ? 12 : 1;
    let count = 0;
    for (let i = 0; i <= months; i += step) {
      if (new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + i, start.getUTCDate())).getUTCDate() === start.getUTCDate()) count++;
    }
    return count;
  }
  function occurs(event, date) {
    if (event.stopBefore && date >= event.stopBefore) return false;
    if (event.ending === 'date' && date > event.until) return false;
    const position = ordinal(event, date);
    return position > 0 && (event.ending !== 'count' || position <= event.count);
  }
  function occurrences(date) {
    const rows = [];
    for (const event of data.events) {
      if (occurs(event, date) && !Object.hasOwn(event.exceptions, date)) rows.push({id:event.id, slot:date, entry:event});
      for (const [slot, entry] of Object.entries(event.exceptions)) {
        if (entry?.date === date && occurs(event, slot)) rows.push({id:event.id, slot, entry});
      }
    }
    return rows.sort((a, b) => (a.entry.allDay ? '' : a.entry.start).localeCompare(b.entry.allDay ? '' : b.entry.start));
  }
  function hero(title, subtitle = '', pageTitle = false) {

        <p class="record">${escape(view.entry?.title ?? view.record.title)}</p><form data-form="delete">
        ${series ? `<label>Удалить<select name="scope">${optionList(scopeOptions(), 'single')}</select></label>` : ''}
        <div class="controls"><button type="submit" class="action primary">Удалить</button><button type="button" data-action="cancel">Отмена</button></div></form>`;
    } else if (view?.type === 'record') {
      const item = view.entry ?? view.record;
      const detail = page === 'notes' ? item.text : (item.allDay ? 'Весь день' : item.start + '–' + item.end)
        + (view.record.repeat === 'none' ? '' : ' · ' + repeats[view.record.repeat]);
      main.innerHTML = `<button type="button" class="back" data-action="back">← ${labels[page]}</button>
        ${hero(item.title, page === 'calendar' ? capital(fullDate.format(asDate(item.date))) : '')}
        <p class="record">${escape(detail)}</p><div class="controls"><button type="button" class="action" data-action="edit">Изменить</button>
        <button type="button" data-action="delete">Удалить</button></div>`;
    } else if (page === 'overview') {
      main.innerHTML = `${hero('Обзор', capital(fullDate.format(asDate(today))), true)}
        <div class="overview-modules">
          ${taskPanel.overview()}
          <section class="section"><h2>Сегодня</h2>${eventList(today)}</section>
          ${nextWeekAgenda()}
          <section class="section"><h2>Последние заметки</h2>${noteList(true)}</section>
        </div>
        <footer class="sync-footer" aria-label="Синхронизация Google">
          <div class="help-title"><h2>Google</h2><button type="button" class="help" data-hint="Две стрелки в шапке сохраняют копию на Диске и обновляют календарь." aria-label="Подсказка: синхронизация" aria-expanded="false"><span aria-hidden="true">?</span></button></div>
          <p id="google-overview-text" role="status"></p>
        </footer>`;
    } else if (page === 'points') {
      main.innerHTML = pointList();
    } else {
      main.innerHTML = page === 'calendar' ? calendar() : `${hero('Заметки', 'Записей: ' + data.notes.length, true)}${noteList(false)}`;
    }
    refreshSyncSummary();
    pointSettingsButton.hidden = page !== 'points' || Boolean(view) || !storageReadable;
    const taskList = view?.type === 'tasks' && taskPanel.isList();
    const createAction = taskList ? ['new-task','Добавить дело'] : createActions[page];
    create.hidden = !storageReadable || (Boolean(view) && !taskList) || !createAction;
    if (createAction) {
      create.dataset.action = createAction[0];
      create.setAttribute('aria-label', createAction[1]);
    }
    nav.querySelectorAll('button').forEach(button => {
      if (button.dataset.page === page) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
  }
  function finish(date) {
    if (!save()) {
      data = loadedRecords ? validate(JSON.parse(loadedRecords)) : emptyRecords();
      if (view?.record) view.record = [...data.events,...data.notes].find(item => item.id === view.record.id);
      return;
    }
    if (date) { selected = date; month = date.slice(0, 7); }
    view = null;
    render();
  }
  main.addEventListener('input', event => {
    const input = event.target;
    if (input instanceof HTMLInputElement) input.setCustomValidity('');
    if (input.name === 'owner' && input.form?.dataset.form === 'task-edit') input.form.setAttribute('data-owner-edited', '');
  });
  main.addEventListener('change', event => {
    if (view?.type === 'tasks') return taskPanel.change(event.target);
    const form = event.target.form;
    if (form?.dataset.form !== 'edit' || page !== 'calendar') return;
    if (event.target.name === 'scope') {
      const scope = event.target.value;
      form.elements.date.value = scope === 'series' ? view.record.date : scope === 'following' ? view.slot : view.entry.date;
      if (view.record.ending === 'count') {
        form.elements.count.value = scope === 'following'
          ? view.record.count - ordinal(view.record, view.slot) + 1
          : view.record.count;
      }
    }
    for (const name of ['end','until']) form.elements.namedItem(name).setCustomValidity('');
    fields(form);
  });
  main.addEventListener('submit', event => {
    event.preventDefault();
    const form = event.target;
    if (!storageReadable) return;
    const values = new FormData(form);
    const get = name => String(values.get(name) ?? '');
    if (view?.type === 'tasks') return taskPanel.submit(form, get);
    if (form.dataset.form === 'point') return savePoint(form, get);
    if (form.dataset.form === 'point-definition') return savePointDefinition(form, get);
    const original = view.record;
    const scope = get('scope');
    if (form.dataset.form === 'delete') {
      if (page === 'notes') data.notes = data.notes.filter(item => item.id !== original.id);
      else if (scope === 'single') original.exceptions[view.slot] = null;
      else if (scope === 'following') original.stopBefore = view.slot;
      else data.events = data.events.filter(item => item.id !== original.id);
      finish();
      return;
    }
    const title = get('title').trim();
    if (!title) {
      form.elements.title.setCustomValidity('Введите название.');
      form.elements.title.reportValidity();
      return;
    }
    if (page === 'notes') {
      data.notes = [{id:original?.id ?? crypto.randomUUID(), title, text:get('text')}, ...data.notes.filter(item => item.id !== original?.id)];
      finish();
      return;
    }
    const allDay = values.has('allDay');
    const entry = {title, date:get('date'), allDay, start:allDay ? '' : get('start'), end:allDay ? '' : get('end')};
    if (!allDay && entry.end <= entry.start) {
      form.elements.end.setCustomValidity('Окончание должно быть позже начала.');
      form.elements.end.reportValidity();
      return;
    }
    if (scope === 'single') {
      original.exceptions[view.slot] = entry;
    } else {
      const repeat = get('repeat');
      const ending = repeat === 'none' ? 'never' : get('ending');
      if (ending === 'date' && get('until') < entry.date) {
        form.elements.until.setCustomValidity('Дата окончания серии должна быть не раньше начала.');
        form.elements.until.reportValidity();
        return;
      }
      const updated = {...entry, id:original?.id ?? crypto.randomUUID(), repeat, ending, until:get('until'), count:Number(get('count')), exceptions:{}};
      if (original?.stopBefore && repeat !== 'none') updated.stopBefore = original.stopBefore;
      if (scope === 'following') {
        updated.id = crypto.randomUUID();
        for (const [slot, exception] of Object.entries(original.exceptions)) {
          if (slot >= view.slot && occurs(updated, slot)) updated.exceptions[slot] = exception;
        }
        original.stopBefore = view.slot;
        data.events.push(updated);
      } else if (original) {
        for (const [slot, exception] of Object.entries(original.exceptions)) {
          if (repeat !== 'none' && occurs(updated, slot)) updated.exceptions[slot] = exception;
        }
        data.events[data.events.indexOf(original)] = updated;
      } else {
        data.events.push(updated);
      }
    }
    finish(entry.date);
  });
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.type === 'submit') return;
    const {page:destination, month:direction, day, period:nextPeriod, event:id, slot, note, point, definitionId, action} = button.dataset;
    if (!menu.contains(button) || ['backups', 'google', 'install', 'point-settings'].includes(action)) menu.open = false;
    if (action === 'install' && installPrompt) {
      const prompt = installPrompt;
      installPrompt = null;
      installButton.hidden = true;
      prompt.prompt().catch(() => showNotice('Откройте меню Chrome, чтобы установить приложение.'));
      return;
    }
    if (action === 'open-tasks' || action === 'point-tasks') {
      taskPanel.open(action === 'point-tasks' ? view.record.id : '');
      view = {type:'tasks'};
      redrawTasks();
      return;
    }
    if (view?.type === 'tasks' && (button.dataset.taskAction || action === 'new-task')) {
      taskPanel.click(button.dataset.taskAction || 'new', button);
      return;
    }
    if (action === 'export') { downloadBackup(); return; }
    if (action === 'import') { backupFile.click(); return; }
    if (action === 'restore' && candidate) {
      const addMissing = (current, incoming) => {
        const ids = new Set(current.map(item => item.id));
        return [...current, ...incoming.filter(item => !ids.has(item.id))];
      };
      const merged = {events:addMissing(data.events,candidate.events), notes:addMissing(data.notes,candidate.notes),
        points:addMissing(data.points,candidate.points), tasks:addMissing(data.tasks,candidate.tasks)};
      const localSettings = data.pointSettings;
      const restoredSettings = candidate.pointSettings;
      if (localSettings && restoredSettings) {
        merged.pointSettings = {
          statuses:addMissing(localSettings.statuses, restoredSettings.statuses),
          fields:addMissing(localSettings.fields, restoredSettings.fields),
        };
      } else if (localSettings || restoredSettings) {
        merged.pointSettings = localSettings ?? restoredSettings;
      }
      const archive = data.chef ?? candidate.chef;
      if (archive !== undefined) merged.chef = archive;
      if (save(merged, 'В браузере не хватает места для записей из копии.')) {
        data = merged;

        candidate = null;
        showNotice('Копия добавлена в браузер.');
      }
    } else if (action === 'backups') { candidate = null; view = {type:'backups'}; }
    else if (!storageReadable && ['edit','delete','new-event','new-note','new-point','edit-point','point-settings',
        'new-point-definition','archive-point-definition'].includes(action)) return;
    else if (destination) { page = destination; view = null; }
    else if (direction) {
      const first = asDate(month + '-01');
      selected = key(new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + Number(direction), 1)));
      month = selected.slice(0, 7);
    } else if (day || action === 'today') {
      selected = day || today;
      month = selected.slice(0, 7);
      period = 'day';
    } else if (Object.hasOwn(periods, nextPeriod)) period = nextPeriod;
    else if (id) {
      const record = data.events.find(item => item.id === id);
      const entry = record.exceptions[slot] ?? {...record, date:button.dataset.occurrenceDate};
      page = 'calendar'; selected = entry.date; month = selected.slice(0, 7);
      view = {type:'record', record, entry, slot};
    } else if (note) {
      page = 'notes'; view = {type:'record', record:data.notes.find(item => item.id === note)};
    } else if (point) {
      const record = data.points.find(item => item.id === point);
      if (!record) return;
      page = 'points'; view = {type:'point', record};
    } else if (action === 'point-settings') {
      page = 'points'; view = {type:'point-settings'};
    } else if (definitionId || action === 'new-point-definition') {
      const category = button.closest('[data-category]')?.dataset.category;
      if (!storageReadable || !['statuses','fields'].includes(category)) return;
      const record = pointSettings(data)[category].find(item => item.id === definitionId);
      if (definitionId && !record) return;
      view = {type:'point-definition', category, record};
    } else if (action === 'archive-point-definition') {
      const {category, record} = view;
      if (record && canArchiveDefinition(category, record)) {
        return commitPointDefinition({...record, archived:!record.archived}, record.archived ? 'Возвращено из архива.' : 'Перемещено в архив.');
      }
      return;
    } else if (action === 'new-point') view = {type:'point-edit'};
    else if (action === 'edit-point') view = {...view, type:'point-edit'};
    else if (action === 'cancel-point') view = view.record ? {...view, type:'point'} : null;
    else if (action === 'new-event' || action === 'new-note') view = {type:'edit'};
    else if (action === 'edit' || action === 'delete') view.type = action;
    else if (action === 'cancel') view = view.record ? {...view, type:'record'} : null;
    else if (action === 'back') view = null;
    else return;
    const pointScreen = page === 'points' && view?.type !== 'backups';
    if (pointScreen && storageReadable) showNotice('');
    render();
    if (destination || pointScreen) window.scrollTo(0, 0);
    if (action === 'new-event' || action === 'new-note') main.querySelector('h1').scrollIntoView({block:'start'});
    if (day) main.querySelector('[data-day="' + day + '"]')?.focus({preventScroll:true});
    if (direction) main.querySelector('[data-month="' + direction + '"]')?.focus({preventScroll:true});
    if (nextPeriod) main.querySelector('[data-period="' + nextPeriod + '"]')?.focus({preventScroll:true});
    if (action === 'today') main.querySelector('[data-action="today"]')?.focus({preventScroll:true});
  });
  document.addEventListener('click', event => {
    if (menu.open && !menu.contains(event.target)) menu.open = false;
  });
  menu.addEventListener('keydown', event => {
    if (event.key === 'Escape') { menu.open = false; menu.querySelector('summary').focus(); }
  });
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    installButton.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    installPrompt = null;
    installButton.hidden = true;
  });
  window.addEventListener('focus', updateToday);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) updateToday(); });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Service worker:', error));
  }
  window.panelRecords = {
    backupVersion,
    snapshot() {
      if (!storageReadable) throw Error('Не удалось прочитать локальные записи.');
      const raw = localStorage.getItem(storageKey);
      if (!raw) return null;
      return validate(JSON.parse(raw));
    },
    parseCopy(value) {
      if (!['03-rabota-backup','panel-03-backup'].includes(value?.format)) throw Error('Неизвестный формат копии.');
      return validate(value);
    },
    offerCopy(records, message) {
      candidate = records;
      view = {type:'backups'};
      showNotice(message);
      render();
    },
    occurs,
    countThrough(event,date) {
      if (date < event.date) return 0;
      let slot = date;
      while (slot >= event.date) {
        const count = ordinal(event, slot);
        if (count) return count;
        slot = offsetDay(slot, -1);
      }
      return 0;
    },
  };
  updateToday();
  render();
})();
</script>
</body>
</html>
