<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF3">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Работа">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Работа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBFAF3;
    --surface: #FFFFFF;
    --text: #221F14;
    --muted: #6A6551;
    --line: #E9E5D0;
    --accent: #E2B72E;         /* пыльный зелёный */
    --accent-strong: #8F6B00;  /* для текста, кнопок, выбранного */
    --accent-soft: #FAEFC2;
    --sand: #F3E9D2;
    --sky: #E3EAEE;
    --on-soft: #4A3B00;        /* текст на цветных плашках */
    --on-sand: #4A3B22;
    --on-sky: #1E3B4A;
    --danger: #A4423B;
    --sans: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --r: 20px;
    --appbar-h: 58px;
    --tabbar-h: 68px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { color-scheme: light; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; }
  button:disabled { opacity: .5; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg.i.solid { fill: currentColor; stroke: none; }

  /* ---------- верхняя панель ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20; height: calc(var(--appbar-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 20px 0;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(251, 250, 243, .94);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.3px; display: flex; align-items: center; gap: 10px; }
  .brand::before {
    content: "03"; width: 32px; height: 32px; border-radius: 10px; background: var(--accent-strong); color: #fff;
    display: grid; place-items: center; font-size: 13px; font-weight: 800; letter-spacing: 0;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
    color: var(--muted); display: grid; place-items: center; cursor: pointer;
  }
  .icon-btn:active { background: var(--accent-soft); }
  #menuBtn { margin-right: -10px; }

  /* ---------- контент ---------- */
  main { padding: 8px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 96px); max-width: 720px; margin: 0 auto; }
  body.n-edit main, body.e-edit main { padding-bottom: 24px; }
  .tab { display: none; }
  .tab.active { display: block; animation: rise .22s ease both; }
  @keyframes rise { from { opacity: 0; } to { opacity: 1; } }

  .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card {
    background: var(--surface); border-radius: var(--r);
    padding: 16px; margin-bottom: 14px;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; gap: 10px; }
  .text-btn { border: 0; background: transparent; color: var(--accent-strong); font-weight: 700; font-size: 14px; padding: 8px 4px; cursor: pointer; min-height: 36px; }
  .muted { color: var(--muted); font-size: 14px; }
  .muted.small { font-size: 12px; margin-top: 8px; }

  /* заголовок страницы (без карточки) */
  .hero { padding: 0 2px 16px; }
  .hero .hello { color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; }
  .hero .date { font-weight: 800; font-size: 32px; line-height: 1.1; letter-spacing: -.9px; margin: 4px 0 16px; }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-bottom: 14px; }
  .wd { height: 68px; border: 0; border-radius: 18px; padding: 0; background: var(--surface); color: var(--text); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
  .wd .a { font-size: 12px; font-weight: 600; color: var(--muted); }
  .wd .b { font-size: 19px; font-weight: 700; }
  .wd i { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .wd.has i { background: var(--accent); }
  .wd.today { background: var(--accent-strong); color: #fff; }
  .wd.today .a { color: var(--accent-soft); }
  .wd.today.has i { background: #fff; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: var(--surface); border-radius: 18px; padding: 12px 16px; }
  .stat .v { font-weight: 800; font-size: 26px; color: var(--accent-strong); line-height: 1.2; }
  .stat .l { font-size: 13px; color: var(--muted); }

  .frame { width: 100%; border: 0; display: block; border-radius: 12px; background: var(--surface); }

  /* журнал */
  .log { list-style: none; margin: 0; padding: 0; }
  .log li { position: relative; padding: 0 0 14px 20px; font-size: 14px; font-weight: 500; }
  .log li:last-child { padding-bottom: 0; }
  .log li::before { content: ""; position: absolute; left: 1px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .log li::after { content: ""; position: absolute; left: 4.5px; top: 17px; bottom: -3px; width: 1px; background: var(--line); }
  .log li:last-child::after { display: none; }
  .log small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 1px; }

  /* поля и кнопки */
  .field {
    display: block; width: 100%; min-width: 0; padding: 13px 14px; font: inherit; font-size: 16px; border: 1px solid var(--line);
    border-radius: 14px; background: var(--bg); color: var(--text); margin-bottom: 10px; outline: none;
  }
  .field:focus { border-color: var(--accent-strong); }
  textarea.field { resize: vertical; line-height: 1.5; }
  .btn { width: 100%; padding: 14px; border: 0; border-radius: 16px; background: var(--accent-strong); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
  .btn:active { opacity: .88; }
  .btn.ghost { background: transparent; color: var(--accent-strong); border: 1.5px solid var(--accent-strong); }

  /* круглая кнопка «+» */
  .fab {
    position: fixed; right: 20px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); z-index: 25;
    width: 60px; height: 60px; border: 0; border-radius: 50%; background: var(--accent-strong); color: #fff;
    display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 6px 16px rgba(143, 107, 0, .30);
  }
  .fab:active { transform: scale(.95); }
  .fab svg.i { width: 26px; height: 26px; stroke-width: 2.2; }

  /* приглашение войти */
  .auth { text-align: center; }
  .auth p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .auth.compact { text-align: left; }
  .auth.compact p { margin-bottom: 10px; }

  /* шапки вкладок */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 0 2px 14px; }
  .page-head h2 { margin: 0; font-weight: 800; font-size: 28px; letter-spacing: -.6px; line-height: 1.1; }

  /* ---------- календарь ---------- */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .seg button { height: 48px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: transparent; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; }
  .seg button.on { color: var(--accent-strong); border-bottom-color: var(--accent-strong); font-weight: 800; }
  .nav { display: flex; align-items: center; gap: 0; margin: 0 0 4px; }
  .nav:empty { display: none; }
  .nav .navtitle { flex: 1; font-weight: 800; font-size: 26px; letter-spacing: -.6px; }
  .nav .icon-btn { color: var(--accent-strong); }
  .nav .text-btn { margin-right: 4px; border: 1.5px solid var(--accent-strong); border-radius: 20px; padding: 0 14px; height: 36px; }

  .mgrid-card { padding: 0; background: transparent; border-radius: 0; margin-bottom: 8px; }
  .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
  .mh { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); height: 26px; line-height: 26px; }
  .mc { height: 46px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; padding: 2px 0 0; cursor: pointer; }
  .mc .n { font-size: 15px; font-weight: 600; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; }
  .mc.other .n { color: #8A968D; font-weight: 500; }
  .mc.today .n { box-shadow: inset 0 0 0 2px var(--accent-strong); color: var(--accent-strong); font-weight: 800; }
  .mc.sel .n { background: var(--accent-strong); color: #fff; font-weight: 800; box-shadow: none; }
  .mc .dots { display: flex; gap: 3px; margin-top: 3px; height: 5px; }
  .mc .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

  .daypanel { margin-top: 6px; }
  .daypanel > .card-head { margin: 0 2px 10px; }
  .daypanel .card-head .label { font-size: 18px; font-weight: 800; letter-spacing: -.3px; text-transform: none; color: var(--text); }
  .daypanel > .muted, .weekwrap .none { background: var(--surface); border-radius: 18px; padding: 16px; }
  .evrow { display: flex; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 0; border-radius: 18px; padding: 10px 14px 10px 10px; margin-bottom: 10px; cursor: pointer; align-items: center; }
  .evtime { width: 62px; min-height: 52px; flex: none; border-radius: 12px; background: var(--accent-soft); color: var(--on-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.25; padding: 4px; }
  .evtime .b { font-weight: 500; font-size: 12px; }
  .evrow:nth-of-type(3n+2) .evtime { background: var(--sand); color: var(--on-sand); }
  .evrow:nth-of-type(3n) .evtime { background: var(--sky); color: var(--on-sky); }
  .stcirc { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--accent-strong); background: transparent; display: grid; place-items: center; cursor: pointer; margin-left: 2px; }
  .stcirc.progress { background: linear-gradient(90deg, var(--accent-strong) 50%, transparent 50%); }
  .stcirc.done { background: var(--accent-strong); }
  .stcirc.done::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .evrow.done { opacity: .6; }
  .evrow.done .evt { text-decoration: line-through; }
  .stf { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 10px; }
  .stf.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 14px; }
  .stf button { height: 36px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; padding: 0 2px; }
  .stf button.on { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 800; }
  .form > .label { display: block; margin-bottom: 6px; }
  .evbar { display: none; }
  .evmain { min-width: 0; flex: 1; }
  .evt { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
  .evloc { color: var(--muted); font-size: 13px; }

  .weekwrap { margin-top: 4px; }
  .wday { margin-bottom: 8px; }
  .wh { display: flex; align-items: center; justify-content: space-between; margin: 6px 2px 8px; }
  .wh .d { font-weight: 800; font-size: 16px; }
  .wday.today .wh .d { color: var(--accent-strong); }
  .wday .none { color: #8A968D; font-size: 14px; margin-bottom: 10px; }
  .dgh { margin: 18px 2px 10px; }
  .dgh.today { color: var(--accent-strong); }
  .daygroup:first-child .dgh { margin-top: 4px; }
  .more { margin-top: 4px; }

  /* строки событий на обзоре */
  .ovrow { display: flex; gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 11px 0; cursor: pointer; align-items: center; }
  .ovrow:first-child { padding-top: 0; }
  .ovrow:last-of-type { border-bottom: 0; }
  .ovd { width: 82px; flex: none; text-align: center; font-size: 13px; font-weight: 800; color: var(--on-soft); background: var(--accent-soft); border-radius: 12px; padding: 8px 4px; }
  .ovrow:nth-of-type(3n+2) .ovd { background: var(--sand); color: var(--on-sand); }
  .ovrow:nth-of-type(3n) .ovd { background: var(--sky); color: var(--on-sky); }

  /* редактор события */
  #eventEditor, #noteEditor { display: none; }
  body.e-edit #calView, body.n-edit #noteListView { display: none; }
  body.e-edit #eventEditor, body.n-edit #noteEditor { display: block; }
  body.n-edit .tabbar, body.e-edit .tabbar { display: none; }
  body.n-edit .toast, body.e-edit .toast { bottom: 24px; }
  .ed-bar { display: flex; align-items: center; justify-content: space-between; margin: 0 -6px 10px; }
  .ed-bar button { border: 0; background: transparent; color: var(--accent-strong); font-weight: 700; font-size: 15px; padding: 10px 8px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 12px; }
  .ed-bar button.danger { color: var(--muted); }
  .ed-bar button.danger.armed { color: var(--danger); }
  .ed-bar button:active { background: var(--accent-soft); }
  .ed-bar svg.i { width: 20px; height: 20px; }
  .form .field.title { font-size: 18px; font-weight: 700; }
  .swrow { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 14px; font-weight: 600; }
  .swrow input { appearance: none; -webkit-appearance: none; width: 48px; height: 30px; margin: 0; border-radius: 15px; background: var(--line); position: relative; outline: 0; border: 0; cursor: pointer; transition: background .2s; }
  .swrow input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.22); }
  .swrow input:checked { background: var(--accent-strong); }
  .swrow input:checked::after { transform: translateX(18px); }
  .dt { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
  .dt .label { grid-column: 1 / -1; margin-bottom: 6px; }
  .form.allday .dt { grid-template-columns: 1fr; }
  .form.allday .dt input[type=time] { display: none; }
  .form .muted.small { margin: -2px 0 12px; }

  /* ---------- заметки ---------- */
  .sync-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: -4px 2px 12px; }
  .sync-row .muted { font-size: 12px; }
  .note-list { padding: 0; overflow: hidden; }
  .note-item { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; cursor: pointer; }
  .note-item:last-child { border-bottom: 0; }
  .note-item:active { background: var(--bg); }
  .note-item .t { font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-item .p { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
  .note-item .d { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .note-item.compact { padding: 11px 0; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border-bottom: 1px solid var(--line); }
  .note-item.compact:first-child { padding-top: 0; }
  .note-item.compact:last-child { border-bottom: 0; padding-bottom: 0; }
  .note-item.compact .t { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
  .note-item.compact .d { margin: 0; flex: none; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  #noteText {
    display: block; width: 100%; border: 0; border-radius: var(--r); background: var(--surface);
    padding: 18px; font: inherit; font-size: 17px; line-height: 1.6; color: var(--text); resize: none; outline: none;
    height: calc(100vh - 170px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    height: calc(100dvh - 170px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); min-height: 240px;
  }

  /* нижнее меню */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: grid; grid-template-columns: repeat(3, 1fr);
    padding-bottom: env(safe-area-inset-bottom);
    background: #fff; border-top: 1px solid var(--line);
  }
  .tabbar button {
    position: relative; height: var(--tabbar-h); border: 0; background: transparent; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--muted); font-size: 12px; font-weight: 600;
  }
  .tabbar button.on { color: var(--accent-strong); font-weight: 800; }

  /* шторки */
  .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(20, 30, 24, .34); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 720px; margin: 0 auto;
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 16px); max-height: 90vh; overflow-y: auto;
    transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); visibility: hidden;
  }
  .sheet.open { transform: none; visibility: visible; }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 16px; }
  .sheet .label { display: block; margin: 0 0 4px; }
  .sheet .label.gap { margin-top: 18px; }
  .sheet p { margin: 8px 0 12px; }
  .row {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; text-align: left; text-decoration: none; color: var(--text); font-weight: 600; font-size: 15px; cursor: pointer;
  }
  .row:last-child { border-bottom: 0; }
  .row svg.i { color: var(--accent-strong); }
  .row small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .row .arrow { margin-left: auto; color: var(--muted); font-size: 14px; }
  .sheet .btn { margin-top: 4px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 10px);
    background: var(--text); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">Работа</div>
  <button class="icon-btn" id="menuBtn" aria-label="Ссылки и настройки">
    <svg class="i solid" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
  </button>
</header>

<main>

  <!-- ОБЗОР -->
  <section class="tab active" id="tab-overview">

    <div class="hero">
      <div class="label hello" id="hello">Здравствуйте</div>
      <div class="date" id="today">&nbsp;</div>
      <div class="week" id="weekStrip"></div>
      <div class="stats">
        <div class="stat"><div class="v" id="statToday">—</div><div class="l">событий сегодня</div></div>
        <div class="stat"><div class="v" id="statNotes">0</div><div class="l">заметок</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Ближайшие события</span><button class="text-btn" id="allEvents">Все</button></div>
      <div id="upcoming"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Заметки</span><button class="text-btn" id="allNotes">Все</button></div>
      <div id="recentNotes"></div>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Файлы</span></div>
      <iframe class="frame" id="driveFrame" height="260" title="Файлы"></iframe>
    </div>

    <div class="card">
      <div class="card-head"><span class="label">Журнал изменений</span></div>
      <ul class="log" id="log"><li class="muted">Загрузка…</li></ul>
    </div>

  </section>

  <!-- КАЛЕНДАРЬ -->
  <section class="tab" id="tab-calendar">
    <div id="calView">

<script>
// ===== НАСТРОЙКИ ПАНЕЛИ (для других панелей меняются только здесь) =====
var CONFIG = {
  panel: "03",                                   // префикс хранилища: у каждой панели свой
  githubUser: "htongrad",
  githubRepo: "03-rabota",
  driveFolderId: "12HGfG0kIpcCQ--eFFuW1ick-Qtkzq1WL",
  calendarId: "d7289a674e28c73f65f28444273094a8d5e60be83bbf6f3b6f04b52ae8f0e592@group.calendar.google.com",
  clientId: "85553095174-nlncho752c9ecg2p5tgl9ak5h9q9c8a1.apps.googleusercontent.com",   // Client ID из Google Cloud (не пароль)
  notesFile: "zametki-sync.json",                // файл синхронизации в папке на Диске
  notesBackup: "Заметки (копия).txt"             // читаемая копия
};
// ========================================================================

var SCOPE_LIST = ["https://www.googleapis.com/auth/calendar.events", "https://www.googleapis.com/auth/drive"];
var SCOPES = SCOPE_LIST.join(" ");
var PREFIX = "p" + CONFIG.panel + "_";

/* ---------- мелкие помощники ---------- */
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hm = (d) => pad(d.getHours()) + ":" + pad(d.getMinutes());
const sod = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDay = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYmd = (s) => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (d, o) => d.toLocaleDateString("ru-RU", o);
function rfc(d) {
  const off = -d.getTimezoneOffset(), a = Math.abs(off);
  return ymd(d) + "T" + hm(d) + ":" + pad(d.getSeconds()) + (off >= 0 ? "+" : "-") + pad(Math.floor(a / 60)) + ":" + pad(a % 60);
}
function fmtDate(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return hm(d);
  return fmt(d, { day: "numeric", month: "short" });
}
function plural(n, f) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return f[2];
  if (b > 1 && b < 5) return f[1];
  if (b === 1) return f[0];
  return f[2];
}
function ago(date) {
  const s = (Date.now() - date.getTime()) / 1000;
  if (s < 60) return "только что";
  const m = Math.floor(s / 60);
  if (m < 60) return m + " " + plural(m, ["минуту", "минуты", "минут"]) + " назад";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " " + plural(h, ["час", "часа", "часов"]) + " назад";
  const d = Math.floor(h / 24);
  return d + " " + plural(d, ["день", "дня", "дней"]) + " назад";
}

/* ---------- хранилище ---------- */
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) {}
  return null;
}
function store(k, v) { return ls(PREFIX + k, v); }

// У всех панелей общий адрес сайта, поэтому у каждой свои ключи. Старые ключи переносим, чтобы заметки не потерялись.
(function migrate() {
  if (CONFIG.panel !== "01") return;   // перенос нужен только для первой панели
  ["notes", "tab", "calMode"].forEach(function (k) {
    if (ls(PREFIX + k) === null && ls(k) !== null) { ls(PREFIX + k, ls(k)); ls(k, null); }
  });
  ls("calendarId", null);
})();

let toastTimer;
function toast(text) {
  const t = $("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
}

/* ---------- приветствие и дата ---------- */
(function () {
  const hr = new Date().getHours();
  $("hello").textContent = hr < 5 ? "Доброй ночи" : hr < 12 ? "Доброе утро" : hr < 18 ? "Добрый день" : "Добрый вечер";
  $("today").textContent = cap(fmt(new Date(), { weekday: "long", day: "numeric", month: "long" }));
})();

/* =====================================================================
   ВХОД В GOOGLE
   ===================================================================== */
// Client ID и токен общие для всех панелей (один адрес сайта), поэтому без префикса
function getClientId() { return CONFIG.clientId || ls("g_client_id") || ""; }
function getToken() {
  const t = ls("g_token"), exp = +ls("g_token_exp") || 0;
  return t && exp > Date.now() + 30000 ? t : "";
}
let expiryTimer;
function setToken(token, seconds) {
  const exp = Date.now() + (seconds || 3600) * 1000;
  ls("g_token", token); ls("g_token_exp", String(exp)); ls("g_connected", "1");
  clearTimeout(expiryTimer);
  expiryTimer = setTimeout(authLost, Math.max(1000, exp - Date.now() - 30000));
}
function clearToken() { ls("g_token", null); ls("g_token_exp", null); }
function authLost() { clearToken(); renderAll(); }

let gisPromise = null, tokenClient = null;
function loadGIS() {
  if (gisPromise) return gisPromise;
  gisPromise = new Promise(function (res, rej) {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;
    s.onload = function () { res(); };
    s.onerror = function () { gisPromise = null; rej(new Error("gis")); };
    document.head.appendChild(s);
  });
  return gisPromise;
}
function onToken(resp) {
  if (!resp || resp.error) { toast("Вход не удался" + (resp && resp.error ? ": " + resp.error : "")); return; }
  const o = google.accounts.oauth2;
  if (o.hasGrantedAllScopes && !o.hasGrantedAllScopes.apply(o, [resp].concat(SCOPE_LIST))) {
    toast("Нужно разрешить и календарь, и Диск");
    try { o.revoke(resp.access_token, function () {}); } catch (e) {}
    return;
  }
  setToken(resp.access_token, resp.expires_in);
  toast("Google подключён");
  renderAll(); loadUpcoming(); syncNotes();
}
function signIn() {
  if (!getClientId()) { openSheet("connect"); return; }
  loadGIS().then(function () {
    if (!tokenClient) {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: getClientId(), scope: SCOPES, callback: onToken,
        error_callback: function (err) { if (err && err.type !== "popup_closed") toast("Не удалось открыть окно входа"); }
      });
    }
    tokenClient.requestAccessToken({ prompt: "" });
  }).catch(function () { toast("Не удалось загрузить вход Google. Проверьте интернет."); });
}
function signOut() {
  const t = ls("g_token");
  try { if (t && window.google && google.accounts) google.accounts.oauth2.revoke(t, function () {}); } catch (e) {}
  clearToken(); ls("g_connected", null);
  evCache = {}; upcoming = null; store("upcoming", null);
  toast("Вы вышли из Google");
  renderAll();
}
function connectAction() { if (!getClientId()) openSheet("connect"); else signIn(); }

// запрос к API Google с токеном
async function gfetch(url, opts) {
  const token = getToken();
  if (!token) throw { code: "auth", message: "Нужно войти в Google" };
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + token });
  let r;
  try { r = await fetch(url, Object.assign({}, opts, { headers: headers })); }
  catch (e) { throw { code: "net", message: "нет связи" }; }
  if (r.status === 401) { clearToken(); renderAll(); throw { code: "auth", message: "Сессия Google закончилась" }; }
  if (!r.ok) {
    let msg = "ошибка " + r.status;
    try { const j = await r.json(); if (j.error && j.error.message) msg = j.error.message; } catch (e) {}
    throw { code: "http", status: r.status, message: msg };
  }
  return r;
}

function authPrompt(compact) {
  const has = !!getClientId(), was = ls("g_connected") === "1";
  const c = el("div", "auth" + (compact ? " compact" : " card"));
  c.appendChild(el("p", "",
    !has ? "Подключите Google, чтобы календарь и заметки синхронизировались с вашим аккаунтом."
    : was ? "Сессия Google закончилась. Войдите снова, чтобы продолжить синхронизацию."
    : "Войдите в Google, чтобы видеть календарь и синхронизировать заметки с Диском."));
  const b = el("button", "btn", has ? "Войти в Google" : "Подключить Google");
  b.onclick = connectAction;
  c.appendChild(b);
  return c;
}

function renderConnect() {
  const body = $("connectBody");
  body.innerHTML = "";
  const has = !!getClientId(), signed = !!getToken();
  function clientForm() {
    body.appendChild(el("p", "muted", "Вставьте Client ID из Google Cloud. Он создаётся один раз, это не пароль."));
    const input = el("input", "field"); input.type = "text"; input.placeholder = "…apps.googleusercontent.com";
    input.autocapitalize = "off"; input.autocomplete = "off"; input.spellcheck = false;
    const b = el("button", "btn", "Сохранить");
    b.onclick = function () {
      const v = input.value.trim();
      if (!/^[\w.-]+\.apps\.googleusercontent\.com$/.test(v)) { toast("Это не похоже на Client ID"); return; }
      ls("g_client_id", v); tokenClient = null; gisPromise = null;
      loadGIS().catch(function () {});
      toast("Сохранено"); renderConnect(); renderAll();
    };
    body.appendChild(input); body.appendChild(b);
  }
  if (!has) { clientForm(); return; }
  body.appendChild(el("p", "muted", signed ? "Google подключён. Календарь и заметки синхронизируются." : "Client ID сохранён. Теперь войдите в Google."));
  const main = el("button", "btn", signed ? "Выйти из Google" : "Войти в Google");
  main.onclick = function () { closeSheets(); if (signed) signOut(); else signIn(); };
  body.appendChild(main);
  if (!CONFIG.clientId) {
    const change = el("button", "text-btn", "Изменить Client ID");
    change.style.marginTop = "12px";
    change.onclick = function () { body.innerHTML = ""; clientForm(); };
    body.appendChild(change);
  }
}

/* =====================================================================
   КАЛЕНДАРЬ: данные
   ===================================================================== */
const calBase = () => "https://www.googleapis.com/calendar/v3/calendars/" + encodeURIComponent(CONFIG.calendarId) + "/events";
let evCache = {};
const STATUSES = ["plan", "progress", "done"];
const STATUS_NAME = { plan: "В планах", progress: "В процессе", done: "Выполнено" };
function normStatus(v) { return STATUSES.indexOf(v) >= 0 ? v : "plan"; }
let stFilter = ["all"].concat(STATUSES).indexOf(store("stFilter")) >= 0 ? store("stFilter") : "all";
let evStat = "plan", evBusyStatus = false;

function normEvent(it) {
  const allDay = !!(it.start && it.start.date);
  return {
    id: it.id, title: it.summary || "", allDay: allDay,
    start: allDay ? parseYmd(it.start.date) : new Date(it.start.dateTime),
    end: allDay ? parseYmd(it.end.date) : new Date(it.end.dateTime),
    location: it.location || "", description: it.description || "", recurring: !!it.recurringEventId,
    status: normStatus(it.extendedProperties && it.extendedProperties.private && it.extendedProperties.private.status)
  };
}
const evKey = (from, to) => from.getTime() + "-" + to.getTime();
async function fetchEvents(from, to) {
  const key = evKey(from, to);
  if (evCache[key]) return evCache[key];
  const out = [];
  let page = null, n = 0;
  do {
    const q = new URLSearchParams({ timeMin: from.toISOString(), timeMax: to.toISOString(), singleEvents: "true", orderBy: "startTime", maxResults: "250" });
    if (page) q.set("pageToken", page);
    const j = await (await gfetch(calBase() + "?" + q)).json();
    (j.items || []).forEach(function (it) { if (it.status !== "cancelled" && it.start && it.end) out.push(normEvent(it)); });
    page = j.nextPageToken; n++;
  } while (page && n < 4);
  evCache[key] = out;
  return out;
}
// раскладывает события по дням (в пределах [from, to))
function bucket(events, from, to, filtered) {
  const m = new Map();
  events.forEach(function (ev) {
    if (filtered && stFilter !== "all" && ev.status !== stFilter) return;
    let d = sod(ev.start);
    const lastDay = ev.end > ev.start ? sod(new Date(ev.end.getTime() - 1)) : d;
    for (let i = 0; i < 62 && d <= lastDay; i++) {
      if (d >= from && d < to) { const k = ymd(d); if (!m.has(k)) m.set(k, []); m.get(k).push(ev); }
      d = addDay(d, 1);
    }
  });
  m.forEach(function (list) { list.sort(function (a, b) { return (b.allDay - a.allDay) || (a.start - b.start); }); });
  return m;
}

/* =====================================================================
   КАЛЕНДАРЬ: экран
   ===================================================================== */
let calMode = ["AGENDA", "WEEK", "MONTH"].indexOf(store("calMode")) >= 0 ? store("calMode") : "MONTH";
let cursor = new Date(), selDay = sod(new Date()), agendaDays = 30, calSeq = 0;

function evTimeText(ev, day) {
  if (ev.allDay) return ["Весь день", ""];
  const sDay = sod(ev.start).getTime(), eDay = sod(new Date(ev.end.getTime() - 1)).getTime(), d = sod(day).getTime();
  if (sDay === eDay || ev.end <= ev.start) return [hm(ev.start), ev.end > ev.start ? hm(ev.end) : ""];
  if (d === sDay) return [hm(ev.start), "→"];
  if (d === eDay) return ["до", hm(ev.end)];
  return ["Весь день", ""];

async function renderCalendar() {

let editingEv = null, evDur = 3600000, evDelArmed = false, evDelTimer = null, evBusy = false;

function readDT(p) {
  const d = $(p + "Date").value, t = $(p + "Time").value || "00:00";
  if (!d) return null;
  const a = d.split("-").map(Number), b = t.split(":").map(Number);

}
function writeDT(p, d) { $(p + "Date").value = ymd(d); $(p + "Time").value = hm(d); }
function resetEvDel() {
  evDelArmed = false; clearTimeout(evDelTimer);
  $("evDel").classList.remove("armed"); $("evDelText").textContent = "Удалить";
}
function openEvent(ev, day) {
  if (!getToken()) { connectAction(); return; }

  const base = sod(day || selDay);
  let s, e, allDay = false;
  if (ev) {
    s = ev.start; e = ev.end; allDay = ev.allDay;
    if (allDay) e = addDay(e, -1);                      // в Google конец «весь день» не включается
    if (e < s) e = s;
  } else {
    const now = new Date();
    s = new Date(base.getFullYear(), base.getMonth(), base.getDate(), sod(now).getTime() === base.getTime() ? Math.min(now.getHours() + 1, 23) : 9, 0);
    e = new Date(s.getTime() + 3600000);
  }
  $("evTitle").value = ev ? ev.title : "";
  $("evAllDay").checked = allDay;
  $("evForm").classList.toggle("allday", allDay);
  writeDT("evStart", s); writeDT("evEnd", e);
  if (allDay) { $("evStartTime").value = "09:00"; $("evEndTime").value = "10:00"; }
  evDur = Math.max(0, readDT("evEnd") - readDT("evStart"));
  $("evLoc").value = ev ? ev.location : "";
  $("evDesc").value = ev ? ev.description : "";
  $("evNote").textContent = ev && ev.recurring ? "Повторяющееся событие: изменится только это вхождение." : "";
  evStat = ev ? ev.status : "plan"; markEvStatus();
  $("evRepeat").value = ""; $("evRepBox").style.display = ev && ev.recurring ? "none" : "block";
  $("evDel").style.visibility = ev ? "visible" : "hidden";
  resetEvDel();

async function saveEvent() {
  if (evBusy) return;
  if (!getToken()) { toast("Сессия закончилась. Войдите и нажмите «Сохранить» ещё раз."); signIn(); return; }
  const allDay = $("evAllDay").checked, s = readDT("evStart"), e = readDT("evEnd");
  if (!s || !e) { toast("Укажите дату"); return; }
  const body = { summary: $("evTitle").value.trim() || "Без названия", location: $("evLoc").value.trim(), description: $("evDesc").value };
  if (allDay) {
    if (sod(e) < sod(s)) { toast("Конец раньше начала"); return; }
    body.start = { date: ymd(sod(s)) }; body.end = { date: ymd(addDay(sod(e), 1)) };
    if (editingEv) { body.start.dateTime = null; body.end.dateTime = null; }
  } else {
    if (e <= s) { toast("Конец должен быть позже начала"); return; }
    body.start = { dateTime: rfc(s) }; body.end = { dateTime: rfc(e) };
    if (editingEv) { body.start.date = null; body.end.date = null; }
  }
  const rep = $("evRepBox").style.display === "none" ? "" : $("evRepeat").value;
  const RULES = { DAILY: "RRULE:FREQ=DAILY", WEEKDAYS: "RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR", WEEKLY: "RRULE:FREQ=WEEKLY", MONTHLY: "RRULE:FREQ=MONTHLY", YEARLY: "RRULE:FREQ=YEARLY" };
  if (rep && RULES[rep]) {

  if (editingEv || !(rep && RULES[rep])) body.extendedProperties = { private: { status: evStat } };
  evBusy = true; $("evSave").disabled = true;
  try {
    await gfetch(editingEv ? calBase() + "/" + encodeURIComponent(editingEv.id) : calBase(), {
      method: editingEv ? "PATCH" : "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    selDay = sod(s); cursor = new Date(s);

  } catch (err) { toast("Не сохранилось: " + err.message); }
  finally { evBusy = false; $("evSave").disabled = false; }
}
async function deleteEvent() {
  if (!editingEv || evBusy) return;
  if (!evDelArmed) {
    evDelArmed = true; $("evDel").classList.add("armed"); $("evDelText").textContent = "Точно удалить?";
    evDelTimer = setTimeout(resetEvDel, 3000);
    return;
  }
  evBusy = true;
  try {
    try { await gfetch(calBase() + "/" + encodeURIComponent(editingEv.id), { method: "DELETE" }); }
    catch (err) { if (!(err.code === "http" && err.status === 410)) throw err; }

function saveNotes() {
  try { localStorage.setItem(PREFIX + "notes", JSON.stringify(notes)); localStorage.setItem(PREFIX + "notes_del", JSON.stringify(deleted)); }
  catch (e) { if (!saveWarned) { saveWarned = true; toast("Не удалось сохранить заметки в браузере"); } }
}
const noteById = (id) => notes.find(function (n) { return n.id === id; }) || null;
const sortedNotes = () => notes.slice().sort(function (a, b) { return b.updated - a.updated; });
function noteTitle(t) {
  const lines = t.split("\n");
  for (let i = 0; i < lines.length; i++) if (lines[i].trim()) return lines[i].trim();
  return "Без названия";
}
function noteBody(t) {
  const lines = t.split("\n"); let seen = false; const out = [];
  for (let i = 0; i < lines.length; i++) { if (!seen) { if (lines[i].trim()) seen = true; continue; } out.push(lines[i]); }
  return out.join(" ").replace(/\s+/g, " ").trim();
}
function removeNote(n) {
  notes.splice(notes.indexOf(n), 1);
  deleted = deleted.filter(function (d) { return d.id !== n.id; });
  deleted.push({ id: n.id, ts: Date.now() });
}

function renderNotes() {
  const list = $("noteList"), recent = $("recentNotes"), all = sortedNotes().filter(function (n) { return n.text.trim() || n.id === currentId; });
  list.innerHTML = ""; recent.innerHTML = "";
  updateStats();
  if (!all.length) {
    list.appendChild(el("div", "empty", "Заметок пока нет. Нажмите «Новая»."));
    const e = el("div", "muted", "Пока пусто. "), b = el("button", "text-btn", "Создать заметку");
    b.onclick = newNote; e.appendChild(b); recent.appendChild(e);
    return;
  }
  all.forEach(function (n) {
    const b = el("button", "note-item");
    b.appendChild(el("div", "t", noteTitle(n.text)));
    const p = noteBody(n.text); if (p) b.appendChild(el("div", "p", p));
    b.appendChild(el("div", "d", fmtDate(n.updated)));
    b.onclick = function () { openNote(n.id); };
    list.appendChild(b);
  });
  all.slice(0, 3).forEach(function (n) {
    const b = el("button", "note-item compact");
    b.appendChild(el("div", "t", noteTitle(n.text))); b.appendChild(el("div", "d", fmtDate(n.updated)));
    b.onclick = function () { openNote(n.id); };
    recent.appendChild(b);
  });
}
function resetDeleteButton() {
  delArmed = false; clearTimeout(delTimer);
  $("edDel").classList.remove("armed"); $("edDelText").textContent = "Удалить";
}
function openNote(id) {
  const n = noteById(id);
  if (!n) return;
  showTab("notes", true);
  currentId = id; resetDeleteButton();
  document.body.classList.add("n-edit");
  pushEd();
  $("noteText").value = n.text;
  window.scrollTo(0, 0);
  if (!n.text) $("noteText").focus();
}
function closeNote(fromHistory) {
  if (!currentId) return;
  clearTimeout(saveTimer);
  const n = noteById(currentId);
  if (n && !n.text.trim()) removeNote(n);
  saveNotes();
  currentId = null; resetDeleteButton();
  document.body.classList.remove("n-edit");
  renderNotes(); window.scrollTo(0, 0);
  if (!fromHistory) popEd();
  scheduleSync(300);
}
function newNote() {
  const n = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: "", updated: Date.now() };
  notes.push(n);
  openNote(n.id);
}
function deleteNote() {
  if (!delArmed) {
    delArmed = true; $("edDel").classList.add("armed"); $("edDelText").textContent = "Точно удалить?";
    delTimer = setTimeout(resetDeleteButton, 3000);
    return;
  }
  const n = noteById(currentId);
  if (n) removeNote(n);
  saveNotes();
  currentId = null; resetDeleteButton();
  document.body.classList.remove("n-edit");
  renderNotes(); popEd();
  toast("Заметка удалена");
  scheduleSync(300);
}
function copyText(t) {
  function fallback() {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.focus(); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    toast(ok ? "Скопировано" : "Не удалось скопировать");
  }
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(function () { toast("Скопировано"); }, fallback);
  else fallback();
}
function notesAsText(list) {
  return list.map(function (n) {
    return new Date(n.updated).toLocaleString("ru-RU", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) + "\n" + n.text;
  }).join("\n\n————————————\n\n");
}
function copyAllNotes() {
  const all = sortedNotes().filter(function (n) { return n.text.trim(); });
  if (!all.length) { toast("Заметок нет"); return; }
  copyText(notesAsText(all));
}

/* ---------- синхронизация с Диском ---------- */
let syncing = false, syncPending = false, syncState = "idle", syncErr = "";

// Слияние: для каждой заметки побеждает самая свежая версия; удаление тоже считается «версией»
function mergeNotes(ln, ld, rn, rd) {
  const best = new Map();
  function consider(id, kind, ts, note) {
    const cur = best.get(id);
    if (!cur || ts > cur.ts || (ts === cur.ts && kind === "del" && cur.kind === "note")) best.set(id, { kind: kind, ts: ts, note: note });
  }
  ln.forEach(function (n) { consider(n.id, "note", n.updated, n); });
  rn.forEach(function (n) { consider(n.id, "note", n.updated, n); });
  ld.forEach(function (d) { consider(d.id, "del", d.ts); });
  rd.forEach(function (d) { consider(d.id, "del", d.ts); });
  const outN = [], outD = [], limit = Date.now() - 90 * 86400000;
  best.forEach(function (v, id) {
    if (v.kind === "note") outN.push({ id: id, text: v.note.text, updated: v.note.updated });
    else if (v.ts > limit) outD.push({ id: id, ts: v.ts });
  });
  return { notes: outN, deleted: outD };
}
const canon = (n, d) => JSON.stringify({
  n: n.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; }).map(function (x) { return [x.id, x.text, x.updated]; }),
  d: d.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; }).map(function (x) { return [x.id, x.ts]; })
});

async function driveFind(name) {
  const q = "name = '" + name.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "' and '" + CONFIG.driveFolderId + "' in parents and trashed = false";
  const r = await gfetch("https://www.googleapis.com/drive/v3/files?" + new URLSearchParams({ q: q, fields: "files(id,name)", pageSize: "5", spaces: "drive" }));
  const j = await r.json();
  return j.files && j.files[0] ? j.files[0].id : null;
}
async function driveRead(id) { return (await gfetch("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media")).text(); }
async function driveCreate(name, mime, content) {
  const b = "b" + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({ name: name, parents: [CONFIG.driveFolderId], mimeType: mime });
  const body = "--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + meta + "\r\n--" + b + "\r\nContent-Type: " + mime + "; charset=UTF-8\r\n\r\n" + content + "\r\n--" + b + "--";
  const r = await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + b }, body: body });
  return (await r.json()).id;
}
async function driveUpdate(id, mime, content) {
  await gfetch("https://www.googleapis.com/upload/drive/v3/files/" + id + "?uploadType=media&fields=id", { method: "PATCH", headers: { "Content-Type": mime + "; charset=UTF-8" }, body: content });
}
async function putFile(name, idKey, mime, content) {
  let id = store(idKey);
  if (id) {
    try { await driveUpdate(id, mime, content); return; }
    catch (e) { if (!(e.code === "http" && e.status === 404)) throw e; store(idKey, null); }
  }
  id = await driveFind(name);
  if (id) await driveUpdate(id, mime, content); else id = await driveCreate(name, mime, content);
  store(idKey, id);
}

function scheduleSync(ms) {
  clearTimeout(syncTimer);
  if (!getToken()) return;
  syncTimer = setTimeout(function () { syncNotes(); }, ms == null ? 6000 : ms);
}
async function syncNotes(manual) {
  if (!getToken()) { if (manual) connectAction(); updateSyncLine(); return; }
  if (syncing) { syncPending = true; return; }
  syncing = true; syncState = "syncing"; updateSyncLine();
  try {
    // 1. что лежит на Диске
    let fileId = store("notes_file_id"), remote = { notes: [], deleted: [] }, text = null;
    if (fileId) {
      try { text = await driveRead(fileId); }
      catch (e) { if (e.code === "http" && e.status === 404) { fileId = null; store("notes_file_id", null); } else throw e; }
    }
    if (!fileId) { fileId = await driveFind(CONFIG.notesFile); if (fileId) { store("notes_file_id", fileId); text = await driveRead(fileId); } }
    if (text !== null) {
      let j;
      try { j = JSON.parse(text); } catch (e) { throw { message: "файл синхронизации на Диске повреждён" }; }
      remote = { notes: Array.isArray(j.notes) ? j.notes : [], deleted: Array.isArray(j.deleted) ? j.deleted : [] };
    }
    // 2. слияние (пустые и незавершённые заметки не отправляем)
    const localNotes = notes.filter(function (n) { return n.text.trim(); });
    const m = mergeNotes(localNotes, deleted, remote.notes, remote.deleted);
    // открытую в редакторе заметку не подменяем
    if (currentId) {
      const open = noteById(currentId);
      m.notes = m.notes.filter(function (n) { return n.id !== currentId; });
      if (open) m.notes.push(open);
    }
    notes = m.notes; deleted = m.deleted;
    saveNotes(); renderNotes();
    // 3. если на Диске не то же самое — обновляем файл и читаемую копию
    const sendNotes = notes.filter(function (n) { return n.text.trim(); });
    if (fileId === null || canon(sendNotes, deleted) !== canon(remote.notes, remote.deleted)) {
      const json = JSON.stringify({ v: 1, updated: Date.now(), notes: sendNotes, deleted: deleted });
      await putFile(CONFIG.notesFile, "notes_file_id", "application/json", json);
      const head = "Заметки: резервная копия от " + new Date().toLocaleString("ru-RU") + "\n\n";
      await putFile(CONFIG.notesBackup, "notes_txt_id", "text/plain", head + (sendNotes.length ? notesAsText(sendNotes.sort(function (a, b) { return b.updated - a.updated; })) : "(заметок нет)"));
    }
    store("notes_sync_ts", String(Date.now()));
    syncState = "ok";
  } catch (e) {
    syncState = e.code === "auth" ? "idle" : "error";
    syncErr = e.message || "ошибка";
  } finally {
    syncing = false; updateSyncLine();
    if (syncPending) { syncPending = false; syncNotes(); }
  }
}
function updateSyncLine() {
  const t = $("syncText"), b = $("syncBtn");
  if (!getToken()) {
    t.textContent = "Диск не подключён"; b.textContent = getClientId() ? "Войти" : "Подключить"; b.onclick = connectAction; b.disabled = false;
    return;
  }
  b.textContent = "Синхронизировать"; b.onclick = function () { syncNotes(true); }; b.disabled = syncState === "syncing";
  if (syncState === "syncing") t.textContent = "Синхронизация…";
  else if (syncState === "error") t.textContent = "Ошибка синхронизации: " + syncErr;
  else { const ts = +store("notes_sync_ts") || 0; t.textContent = ts ? "Синхронизировано в " + fmtDate(ts) : "Ещё не синхронизировано"; }
}

function setupNotes() {
  loadNotes();
  const ta = $("noteText");
  ta.addEventListener("input", function () {
    const n = noteById(currentId);
    if (!n) return;
    n.text = ta.value; n.updated = Date.now();
    clearTimeout(saveTimer); saveTimer = setTimeout(saveNotes, 250);
    scheduleSync(8000);
  });
  $("newNote").onclick = newNote;
  $("edBack").onclick = function () { closeNote(); };
  $("edDel").onclick = deleteNote;
  $("allNotes").onclick = function () { showTab("notes"); };
  $("allEvents").onclick = function () { showTab("calendar"); };
  window.addEventListener("pagehide", function () { clearTimeout(saveTimer); if (currentId) saveNotes(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) { clearTimeout(saveTimer); if (currentId) saveNotes(); } });
  renderNotes();
}

/* =====================================================================
   ВКЛАДКИ, ШТОРКИ, КНОПКА «НАЗАД»
   ===================================================================== */
// кнопка «Назад» на телефоне сначала закрывает редактор, а не выходит из приложения
let edDepth = 0, ignorePop = 0;
function pushEd() { try { history.pushState({ ed: 1 }, ""); edDepth++; } catch (e) {} }
function popEd() { if (edDepth > 0) { edDepth--; ignorePop++; history.back(); } }
window.addEventListener("popstate", function () {
  if (ignorePop > 0) { ignorePop--; return; }
  if (edDepth > 0) { edDepth--; closeNote(true); closeEvent(true); }
});

function showTab(name, keepEditors) {
  if (!keepEditors) { if (currentId) closeNote(); closeEvent(); }
  const tabs = document.querySelectorAll(".tab");
  for (let i = 0; i < tabs.length; i++) tabs[i].classList.toggle("active", tabs[i].id === "tab-" + name);
  const btns = document.querySelectorAll(".tabbar button");
  for (let j = 0; j < btns.length; j++) btns[j].classList.toggle("on", btns[j].getAttribute("data-tab") === name);
  store("tab", name);
  window.scrollTo(0, 0);
  if (name === "calendar") renderCalendar();
}
function setupTabs() {
  const btns = document.querySelectorAll(".tabbar button");
  for (let i = 0; i < btns.length; i++) btns[i].onclick = function () { showTab(this.getAttribute("data-tab")); };
  const saved = store("tab");
  if (saved === "calendar" || saved === "overview" || saved === "notes") showTab(saved);
}

function closeSheets() {
  $("sheet").classList.remove("open"); $("connect").classList.remove("open"); $("backdrop").classList.remove("open");
}
function openSheet(which) {
  closeSheets();
  if (which === "connect") renderConnect();
  $(which).classList.add("open"); $("backdrop").classList.add("open");
}
function setupSheets() {
  $("menuBtn").onclick = function () { openSheet("sheet"); };
  $("backdrop").onclick = closeSheets;
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheets(); });
  $("rowAccount").onclick = function () { openSheet("connect"); };
  $("rowSync").onclick = function () { closeSheets(); syncNotes(true); };
  $("copyNotes").onclick = function () { closeSheets(); copyAllNotes(); };
}

/* ---------- общий перерисовщик ---------- */
function renderAll() {
  $("accStatus").textContent = getToken() ? "Подключено" : getClientId() ? "Нужно войти" : "Не подключено";
  renderUpcoming();
  renderCalendar();
  updateSyncLine();
  if ($("connect").classList.contains("open")) renderConnect();
}

/* ---------- запуск ---------- */
setupNotes();
setupEventEditor();
setupTabs();
setupSheets();
setLinks();
loadDrive();
loadCommits();
if (getClientId()) loadGIS().catch(function () {});
if (getToken()) {
  setToken(ls("g_token"), (+ls("g_token_exp") - Date.now()) / 1000);
  loadUpcoming(); syncNotes();
}
renderAll();
</script>
